<style>
/* ─── EXHIBITION GALLERY ─── */
.exh-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 48px;
}
.exh-item {
  overflow: hidden;
  cursor: zoom-in;
  background: var(--bg-warm);
}
.exh-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  aspect-ratio: 3/2;
  display: block;
  transition: opacity .25s;
}
.exh-item:hover img { opacity: .88; }

/* ─── LIGHTBOX ─── */
.lb {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999;
  background: rgba(0,0,0,.93);
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
}
.lb.open { display: flex; }
.lb-img {
  max-width: 92vw;
  max-height: 92vh;
  object-fit: contain;
  display: block;
  cursor: default;
  box-shadow: 0 8px 60px rgba(0,0,0,.6);
}
.lb-close {
  position: fixed;
  top: 20px; right: 24px;
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: rgba(255,255,255,.65);
  font-size: 28px; font-weight: 200; line-height: 1;
  transition: color .2s;
  user-select: none; z-index: 1000;
}
.lb-close:hover { color: #fff; }
.lb-prev, .lb-next {
  position: fixed; top: 50%; transform: translateY(-50%);
  width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: rgba(255,255,255,.5);
  font-size: 28px; font-weight: 200;
  transition: color .2s;
  user-select: none; z-index: 1000;
}
.lb-prev { left: 16px; }
.lb-next { right: 16px; }
.lb-prev:hover, .lb-next:hover { color: #fff; }
.lb-counter {
  position: fixed; bottom: 24px; left: 0; right: 0;
  text-align: center;
  color: rgba(255,255,255,.4);
  font-family: 'Montserrat', sans-serif;
  font-size: 11px; letter-spacing: 0.1em;
  pointer-events: none;
}

@media (max-width: 768px) {
  .exh-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
}
@media (max-width: 480px) {
  .exh-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
}
</style>

<script src="lang.js"></script>
<script>
(function () {
  var lb      = document.getElementById('lb');
  var lbImg   = document.getElementById('lb-img');
  var lbCount = document.getElementById('lb-counter');
  var lbClose = document.getElementById('lb-close');
  var lbPrev  = document.getElementById('lb-prev');
  var lbNext  = document.getElementById('lb-next');
  var images  = [];
  var current = 0;

  document.querySelectorAll('.exh-item img').forEach(function (img, i) {
    images.push(img.src);
    img.parentElement.addEventListener('click', function () { open(i); });
  });

  function open(i) {
    current = (i + images.length) % images.length;
    lbImg.src = images[current];
    lbCount.textContent = (current + 1) + ' / ' + images.length;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function close() {
    lb.classList.remove('open');
    lbImg.src = '';
    document.body.style.overflow = '';
  }

  lbClose.addEventListener('click', close);
  lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
  lbPrev.addEventListener('click', function (e) { e.stopPropagation(); open(current - 1); });
  lbNext.addEventListener('click', function (e) { e.stopPropagation(); open(current + 1); });

  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape')     close();
    if (e.key === 'ArrowLeft')  open(current - 1);
    if (e.key === 'ArrowRight') open(current + 1);
  });
})();
</script>
